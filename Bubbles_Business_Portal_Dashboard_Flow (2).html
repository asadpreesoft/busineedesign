<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubbles Networks – Business Portal (Dashboard flow)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<style>
:root{--brand-primary:#3A76F0;--brand-primary-hover:#2E5FC0;--brand-primary-pressed:#254B99;--brand-primary-tint:#E7EFFD;--brand-on-primary:#fff;--success:#34C759;--warning:#FF9500;--error:#FF3B30;--info:#007AFF;--bg:#fff;--surface:#fff;--surface-secondary:#F9FAFB;--text:#000;--border:#E5E7EB;--mute:#6B7280;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--surface-secondary);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.top{max-width:760px;margin:auto;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-weight:800;color:var(--brand-primary);font-size:18px}.logo small{color:var(--mute);font-weight:500;font-size:12px;margin-left:4px}
.lnk{background:none;border:0;color:var(--brand-primary);font:600 14px inherit;font-family:inherit;cursor:pointer;padding:6px 8px}
main{max-width:760px;margin:16px auto 20px;padding:0 14px}
.steps{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:14px}
.st{flex:1;text-align:center;font-size:12px;color:var(--mute)}.st.done{cursor:pointer}
.st b{display:grid;place-items:center;width:28px;height:28px;margin:0 auto 4px;border-radius:50%;background:var(--border);font-size:13px}
.st.on b{background:var(--brand-primary);color:#fff}.st.on{color:var(--text);font-weight:600}.st.done b{background:var(--success);color:#fff}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:24px 0 8px}p.sub{color:var(--mute);margin:0 0 16px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,textarea,select{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font:inherit}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand-primary);border-color:var(--brand-primary)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.row{grid-template-columns:1fr}}
.hint{font-size:13px;color:var(--mute);font-weight:400}.err{font-size:13px;color:var(--error);margin-top:6px}
.btn{border:0;border-radius:10px;padding:12px 18px;font:600 15px inherit;font-family:inherit;cursor:pointer;background:var(--brand-primary);color:#fff;white-space:nowrap}
.btn:hover{background:var(--brand-primary-hover)}.btn:active{background:var(--brand-primary-pressed)}
.btn.ghost{background:var(--surface);color:var(--brand-primary);border:1.5px solid var(--brand-primary)}.btn.ghost:hover{background:var(--brand-primary-tint)}
.bar{display:flex;gap:10px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--border);border-radius:14px;padding:16px;cursor:pointer}.opt:hover{border-color:var(--brand-primary);background:var(--brand-primary-tint)}
.opt .ic{font-size:26px}.opt b{display:block}.opt span{font-size:13px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:7px 12px;border:1.5px solid var(--border);border-radius:99px;font-size:13px;cursor:pointer;background:var(--surface)}.chip:hover{border-color:var(--brand-primary)}.chip.sel{background:var(--brand-primary);border-color:var(--brand-primary);color:#fff}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ph{aspect-ratio:1;border:2px dashed var(--border);border-radius:12px;display:grid;place-items:center;color:var(--mute);font-size:12px;text-align:center;cursor:pointer;background-size:cover;background-position:center;position:relative}
.ph i{position:absolute;top:3px;right:3px;background:#000a;color:#fff;border-radius:50%;width:20px;height:20px;font-style:normal;line-height:20px}
.note{background:var(--brand-primary-tint);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}.note.bad{background:#FF3B3015;border-left:4px solid var(--error)}.note.ok{background:#34C75918;border-left:4px solid var(--success)}
.adds{display:flex;gap:8px;flex-wrap:wrap}.adds .btn{padding:8px 14px;font-size:14px}
.f2{display:flex;gap:8px}.f2 select{width:auto;max-width:42%}
.phone{max-width:340px;margin:auto;border:8px solid #111;border-radius:30px;overflow:hidden}
.pv-img{height:170px;background:var(--brand-primary);background-size:cover;background-position:center}
.pv{padding:14px}.pv .tag{display:inline-block;background:var(--brand-primary);color:#fff;border-radius:99px;padding:3px 12px;font-weight:700;font-size:14px}.pv h3{margin:8px 0 2px}.pv small{color:var(--mute)}
.plan{display:flex;gap:10px;align-items:center;border:2px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}.plan.sel{border-color:var(--brand-primary);background:var(--brand-primary-tint)}.plan.off{opacity:.5;cursor:not-allowed}
.plan input{width:auto}.plan div{flex:1}.plan span{font-size:13px;color:var(--mute);display:block}
.code{letter-spacing:10px;text-align:center;font-size:22px}.center{text-align:center}.big{font-size:54px}.hide{display:none}
.chat{height:380px;overflow-y:auto;background:var(--surface-secondary);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;padding:9px 13px;border-radius:16px;font-size:15px}.m.n{background:var(--surface);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}.m.u{background:var(--brand-primary);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.av{font-size:12px;color:var(--brand-primary);font-weight:700}
.ov{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:18px}}
.sg{border:1px solid var(--border);border-radius:10px;margin-top:6px;max-height:140px;overflow:auto}.sg div{padding:8px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--border)}.sg div:hover{background:var(--brand-primary-tint)}

header{background:linear-gradient(135deg,#254B99 0%,#3A76F0 62%,#6E9CFF 100%);color:#fff;border:0;position:relative;overflow:hidden;padding-bottom:44px}
.bb{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffffff55,#ffffff10);border:1px solid #ffffff44}
.b1{width:130px;height:130px;right:-30px;top:-50px}.b2{width:70px;height:70px;right:22%;bottom:6px}.b3{width:46px;height:46px;left:8%;bottom:14px}
.top,.hero{position:relative}.logo{color:#fff;font-size:20px}.logo small{color:#ffffffcc}#hb .lnk{color:#fff}
.hero{max-width:760px;margin:0 auto;padding:0 16px}.hero h2{margin:0;font-size:24px;line-height:1.2}.hero p{margin:2px 0 8px;opacity:.9;font-size:15px}
.pills{display:flex;gap:8px;flex-wrap:wrap}.pills span{background:#ffffff26;border:1px solid #ffffff44;border-radius:99px;padding:2px 10px;font-size:12px}
@media(max-width:520px){.hero h2{font-size:22px}}
main{margin-top:-32px;position:relative;z-index:6}
.steps,.card{border:0;box-shadow:0 12px 32px rgba(37,75,153,.14)}
.btn{box-shadow:0 4px 12px rgba(58,118,240,.28)}.btn.ghost{box-shadow:none}
input,textarea,select{border-radius:12px;background:var(--surface-secondary)}input:focus,textarea:focus,select:focus{background:#fff}
.opt{transition:.15s}.opt:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(58,118,240,.15)}
#app{display:none}body.pt #app{display:block}body.pt header,body.pt main{display:none}
.sb{position:fixed;left:0;top:0;bottom:0;width:248px;background:linear-gradient(180deg,#254B99,#3A76F0);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 12px 14px;display:flex;flex-direction:column;z-index:30;transition:.2s}
.sl{font-weight:800;font-size:18px;white-space:nowrap;padding:0 10px 18px}.sl small{display:block;font-weight:500;font-size:12px;opacity:.75}
.sb nav{flex:1}.sb a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;color:#ffffffd9;cursor:pointer;margin-bottom:3px;font-weight:500}
.sb a:hover{background:#ffffff1f}.sb a.on{background:#fff;color:var(--brand-primary-pressed);font-weight:700}
.sp{background:#ffffff22;border-radius:14px;padding:12px;margin-bottom:10px;font-size:14px}.sp small{display:block;opacity:.85}.sp button{margin-top:8px;border:0;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer;color:var(--brand-primary-pressed)}
.mn{margin-left:248px;min-height:100vh;min-width:0}.tb{position:sticky;top:0;background:#ffffffee;backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;gap:12px;z-index:10}
.tb .btn{padding:9px 14px;font-size:14px}.hm{display:none;border:0;background:none;font-size:22px;cursor:pointer}
.av2{width:36px;height:36px;border-radius:50%;background:var(--brand-primary);color:#fff;display:grid;place-items:center;font-weight:700}
.ct{padding:22px 28px;max-width:none;width:100%}.scr{display:none}
@media(max-width:860px){.sb{transform:translateX(-100%)}.sb.open{transform:none}.mn{margin-left:0}.hm{display:block}.scr.show{display:block;position:fixed;inset:0;background:#0006;z-index:25}.tb{padding:10px 14px}.ct{padding:14px}.av2{display:none}.tb .btn{font-size:12px;padding:8px 10px;white-space:normal}}
.wel{background:linear-gradient(120deg,#3A76F0,#6E9CFF);color:#fff;border-radius:18px;padding:22px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.wel h1{margin:0}.wel p{margin:4px 0 0;opacity:.92}.wb{font-size:54px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.sc2{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px}.sc2 .i{font-size:22px}.sc2 b{display:block;font-size:26px}.sc2 small{color:var(--mute)}.sc2 em{display:block;color:#1f9d45;font-style:normal;font-size:12px}
.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-bottom:12px}@media(max-width:760px){.g2{grid-template-columns:1fr}}
.pc{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}.pc h3{margin:0 0 10px;font-size:16px}.hd{display:flex;justify-content:space-between;align-items:center}
.pr{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--border)}.pr:first-of-type{border:0}
.th{width:64px;height:64px;border-radius:12px;background:var(--brand-primary) center/cover;flex:none}.pr .in{flex:1;min-width:160px}.pr small{color:var(--mute);display:block}
.chip2{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#34C75922;color:#1f8a3b}.chip2.w{background:#FF950022;color:#b36500}
.prog{height:8px;background:var(--border);border-radius:9px;overflow:hidden;margin:6px 0 10px}.prog i{display:block;height:100%;background:var(--brand-primary)}
.ck{display:flex;gap:8px;font-size:14px;padding:3px 0}.ck.d{color:var(--mute)}
.pl4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.pl4 .pc{margin:0}.pl4 .on{border:2px solid var(--brand-primary);background:var(--brand-primary-tint)}
details{border-top:1px solid var(--border);padding:10px 0}summary{cursor:pointer;font-weight:600}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:99px;z-index:50;font-size:14px}

/* ===== address suggestions, country picker, live map, responsive ===== */
.adw,.ccw{position:relative}
.adl{position:absolute;left:0;right:0;top:100%;margin-top:6px;max-height:min(280px,45vh);background:var(--surface);box-shadow:0 12px 32px rgba(17,24,39,.18);z-index:15;border-color:var(--border)}
.adl .it{display:block;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14px;line-height:1.35}
.adl .it:last-of-type{border-bottom:0}
.adl .it b{display:block;font-weight:600}.adl .it span{display:block;color:var(--mute);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adl .it:hover,.adl .it.act{background:var(--brand-primary-tint)}
.adl .msg{padding:12px;color:var(--mute);font-size:13.5px}
.adl .att{padding:6px 12px;font-size:11px;color:var(--mute);background:var(--surface-secondary);border-top:1px solid var(--border);position:sticky;bottom:0}
.ccb{flex:none;display:flex;align-items:center;gap:7px;padding:0 12px;min-height:46px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface-secondary);color:var(--text);font:inherit;cursor:pointer;white-space:nowrap}
.ccb:hover,.ccb[aria-expanded=true]{border-color:var(--brand-primary);background:#fff}
.ccb .car{font-size:11px;color:var(--mute)}
.fl{width:24px;height:18px;border-radius:3px;object-fit:cover;box-shadow:0 0 0 1px #0002;flex:none;display:inline-block;vertical-align:middle}
.flx{font-size:18px;line-height:1;width:24px;text-align:center;flex:none}
.ccp{position:absolute;top:100%;left:0;margin-top:6px;width:min(360px,100%);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 32px rgba(17,24,39,.2);z-index:15;padding:8px}
.ccp .ccs{margin-bottom:6px}
.ccl{max-height:min(260px,40vh);overflow:auto;overscroll-behavior:contain}
.cci{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:9px;cursor:pointer;font-size:14px}
.cci:hover,.cci.act{background:var(--brand-primary-tint)}.cci.sel{font-weight:700}
.cci .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cci .dl{color:var(--mute);font-variant-numeric:tabular-nums}
.ccl .msg{padding:12px;color:var(--mute);font-size:13.5px;text-align:center}
.f2>input{min-width:0;flex:1}
.mapsrch{position:relative;margin-top:8px}
.mapsrch .adl{margin-top:4px}
.mtools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.mtools .btn{padding:8px 12px;font-size:14px}
#lmap{width:100%;height:clamp(230px,44vh,440px);border-radius:12px;border:1px solid var(--border);position:relative;z-index:0;isolation:isolate;background:#e8eef7}
.pinw,.shopw{background:none;border:0}
.pin{position:absolute;left:0;top:0;width:28px;height:28px;background:#FF3B30;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 3px 8px #0006}
.pin:after{content:"";position:absolute;left:6px;top:6px;width:10px;height:10px;border-radius:50%;background:#fff}
.shopw{font-size:26px;line-height:1;text-align:center;filter:drop-shadow(0 2px 3px #0005)}
.mfail{display:grid;place-items:center;text-align:center;padding:20px;color:var(--mute);font-size:14px}
@media(max-width:520px){
 main{padding:0 10px}.card{padding:16px}
 .steps{padding:10px 4px;gap:2px}.st{font-size:11px}.st b{width:24px;height:24px;font-size:12px}
 .hero h2{font-size:20px}.hero p{display:none}.pills{display:none}.hero{padding-bottom:2px}
 .bar>.btn{flex:1 1 auto}.ov .sheet{padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px))}
 .ccb{padding:0 9px;gap:5px}
}
.logo{white-space:nowrap}#hb .lnk{white-space:nowrap}
@media(max-width:480px){.logo{font-size:18px;line-height:1.15}.logo small{display:block;margin:2px 0 0 26px;font-size:11px}#hb .lnk{font-size:13px;padding:6px 0}.top{padding:8px 14px}}
.row.keep{grid-template-columns:1fr 1fr!important;gap:8px}
@media(max-width:360px){.hero h2{font-size:19px}.ccb .car{display:none}}
@media(min-width:1200px){.top,.hero,main{max-width:840px}.hero h2{font-size:28px}.card{padding:28px}}
@media(min-width:700px){.sheet{max-width:680px}}

/* inline validation */
.ferr{font-size:13px;color:var(--error);margin-top:6px;font-weight:500;display:flex;gap:6px;align-items:flex-start;line-height:1.35}
.ferr:before{content:"!";flex:none;width:16px;height:16px;border-radius:50%;background:var(--error);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:1px}
input.inv,textarea.inv,select.inv{border-color:var(--error)!important;background:#FF3B3008}
input.inv:focus,textarea.inv:focus{outline-color:var(--error)}
.chips.inv{outline:1.5px solid var(--error);outline-offset:5px;border-radius:12px}

/* OTP screen */
.vf{text-align:center;max-width:460px;margin:0 auto}
.vf .mi{width:68px;height:68px;border-radius:50%;background:var(--brand-primary-tint);display:grid;place-items:center;font-size:32px;margin:4px auto 14px;box-shadow:0 0 0 8px #E7EFFD66}
.vf h1{margin-bottom:6px}.vf .em{display:inline-block;background:var(--surface-secondary);border:1px solid var(--border);border-radius:99px;padding:3px 12px;font-weight:600;margin:2px 0}
.otp{display:flex;gap:10px;justify-content:center;margin:24px 0 8px}
.ob{width:52px;height:62px;padding:0;text-align:center;font-size:26px;font-weight:700;border-radius:14px;caret-color:var(--brand-primary)}
.ob:not(:placeholder-shown){border-color:var(--brand-primary);background:var(--brand-primary-tint)}
.otp.inv .ob{border-color:var(--error);background:#FF3B3008}
.otp+.ferr{justify-content:center}
.vf .hint{margin-top:10px}.vf .lnk:disabled{color:var(--mute);cursor:default}
.vf .bar{margin-top:26px;text-align:left}
@media(max-width:420px){.otp{gap:6px}.ob{width:44px;height:54px;font-size:22px;border-radius:12px}}
/* review screen */
.rv{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:28px;align-items:start;margin-top:10px}
@media(max-width:760px){.rv{grid-template-columns:1fr}}
.rv .phone{margin:0 auto;box-shadow:0 16px 36px rgba(37,75,153,.22);background:#fff;width:100%}
.pv-img{position:relative}.pv-img.ph0{display:grid;place-items:center;background:linear-gradient(135deg,#3A76F0,#8fb4ff)}.pv-img.ph0 span{font-size:68px;filter:drop-shadow(0 4px 8px #0003)}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:#fff9;cursor:pointer}.dots i.on{background:#fff;transform:scale(1.2)}
.pvh{display:flex;gap:10px;align-items:center;margin-bottom:10px}.pvh small{display:block}.pvh b{line-height:1.2}
.av3{width:34px;height:34px;border-radius:50%;background:var(--brand-primary);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.pv p{margin:4px 0 8px}.pvr{display:flex;gap:6px;font-size:12.5px;color:var(--mute);margin-top:4px}
.pvb{display:flex;gap:8px;margin-top:12px}.pvb span{flex:1;text-align:center;padding:8px;border-radius:10px;background:var(--brand-primary-tint);color:var(--brand-primary);font:600 13px system-ui}
.sm{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14.5px}.sm span{color:var(--mute);flex:none}.sm b{text-align:right;font-weight:600;overflow-wrap:anywhere}
.rvr h2{font-size:16px;margin:0 0 4px}.rvr h2.t2{margin-top:20px}.rvr .ck{padding:5px 0}
/* NEBO generated image */
.gimg{display:block;width:100%;max-width:300px;border-radius:12px;margin-top:8px;border:1px solid var(--border);box-shadow:0 6px 16px rgba(37,75,153,.15)}

/* promotion cards */
.plist{display:grid;gap:16px}
.pcard{display:flex;background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 4px 16px rgba(37,75,153,.07);transition:.15s}
.pcard:hover{box-shadow:0 10px 26px rgba(37,75,153,.14);transform:translateY(-1px)}
.pcard .im{position:relative;flex:0 0 clamp(240px,34%,380px);min-height:230px;background:linear-gradient(135deg,#3A76F0,#8fb4ff) center/cover;display:grid;place-items:center}
.pcard .im .em{font-size:72px;filter:drop-shadow(0 4px 8px #0003)}

/* ===== OpenStreetMap geocoding (Photon search, Nominatim reverse) ===== */
const GC={};let gAbort=null;
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uniq=a=>a.filter((x,i)=>x&&a.indexOf(x)===i);
async function geoSearch(q,bias){
 const k=q.toLowerCase()+(bias?'@'+bias.lat.toFixed(1)+','+bias.lng.toFixed(1):'');if(GC[k])return GC[k];
 gAbort&&gAbort.abort();gAbort=new AbortController();const signal=gAbort.signal;let out=[];
 try{
  const r=await fetch('https://photon.komoot.io/api/?lang=en&limit=6&q='+encodeURIComponent(q)+(bias?`&lat=${bias.lat}&lon=${bias.lng}`:''),{signal});
  if(!r.ok)throw new Error('photon');const j=await r.json();
  out=(j.features||[]).map(f=>{const p=f.properties||{},c=f.geometry.coordinates,st=[p.housenumber,p.street].filter(Boolean).join(' ');
   const main=p.name||st||p.city||p.state||p.country||'';const sub=uniq([p.name&&st?st:'',p.district||p.locality,p.city,p.state,p.country]).filter(x=>x!==main);
   return{main,sub:sub.join(', '),label:[main,...sub].join(', '),lat:c[1],lng:c[0]}});
 }catch(e){
  if(e.name==='AbortError')throw e;
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q='+encodeURIComponent(q),{signal});
  const j=await r.json();out=j.map(x=>{const a=x.display_name.split(', ');return{main:a[0],sub:a.slice(1,4).join(', '),label:x.display_name,lat:+x.lat,lng:+x.lon}});
 }
 return GC[k]=out}
let revT,revN=0;
async function reverseGeo(lat,lng){
 try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=en&lat=${lat}&lon=${lng}`);const j=await r.json();
  if(j.error)throw 0;const a=j.address||{},st=[a.house_number,a.road||a.pedestrian||a.footway].filter(Boolean).join(' ');
  const name=j.name&&j.name!==a.road?j.name:'';
  return uniq([name,st,a.neighbourhood||a.suburb,a.city||a.town||a.village||a.county,a.state,a.country]).join(', ')||j.display_name;
 }catch(e){return`${lat.toFixed(5)}, ${lng.toFixed(5)}`}}
const deb=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
function sugHTML(list,pickFn,note){return list.length?list.map((r,i)=>`<div class="it" role="option" data-i="${i}" onclick="${pickFn}(${i})"><b>📍 ${esc(r.main)}</b>${r.sub?`<span>${esc(r.sub)}</span>`:''}</div>`).join('')+`<div class="att">© OpenStreetMap contributors</div>`:`<div class="msg">${note||'No matches found. Try a nearby landmark or drop a pin on the map.'}</div>`}

/* ===== NEBO image generator: builds a storefront illustration from the business + category + prompt ===== */
const CI={'Retail Shops and Services':['🛍️',215],'Pet Services':['🐶',28],'Food and Drink':['🍽️',12],'Childcare and Caregiving':['🧸',330],'Household Help and Repair':['🔧',200],'Laundry':['🧺',195],'Housing':['🏠',160],'Moving':['📦',32],'Health and Fitness':['💪',145],'Beauty and Personal Care':['💅',320],'Professional Services':['💼',225],'Automotive':['🚗',5],'Events and Entertainment':['🎉',275],'City Hall':['🏛️',240],'Other':['✨',220]};
function aiArt(prompt,cat,name,seed){
 let st=0;for(const ch of (prompt+'|'+name))st=(st*31+ch.charCodeAt(0))>>>0;st=(st+Math.floor((seed||0)*1e9))>>>0;
 const rnd=()=>(st=(st*1664525+1013904223)>>>0)/4294967296,[em,h0]=CI[cat]||CI.Other,p=(prompt||'').toLowerCase();
 const night=/night|dark|evening/.test(p),sun=/sunset|sunrise|golden|warm/.test(p),h=(h0+Math.floor(rnd()*30)-15+360)%360;
 const sk1=night?'#16213e':sun?'#ff9a6c':`hsl(${h},85%,80%)`,sk2=night?'#3a4a7a':sun?'#ffe0b0':`hsl(${h},90%,95%)`,wall=night?`hsl(${h},25%,30%)`:`hsl(${h},40%,97%)`;
 const nm=(name||'Your Business').trim(),short=nm.length>15?nm.slice(0,14)+'…':nm,fs=Math.max(13,Math.min(24,190/Math.max(short.length,1)*1.7));
 let sky='';for(let i=0;i<8;i++){const x=i*86-10,hh=90+rnd()*120;sky+=`<rect x="${x}" y="${330-hh}" width="${60+rnd()*30}" height="${hh}" rx="4" fill="hsl(${h},35%,${night?24:76}%)" opacity=".75"/>`}
 let aw='';for(let i=0;i<10;i++){const x=160+i*32;aw+=`<path d="M${x} 172h32v24a16 16 0 0 1-32 0z" fill="${i%2?'#fff':`hsl(${h},75%,52%)`}"/>`}
 let bub='';for(let i=0;i<6;i++){bub+=`<circle cx="${30+rnd()*580}" cy="${20+rnd()*140}" r="${6+rnd()*18}" fill="#fff" fill-opacity=".28" stroke="#fff" stroke-opacity=".6"/>`}
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sk1}"/><stop offset="1" stop-color="${sk2}"/></linearGradient></defs>
<rect width="640" height="400" fill="url(#g)"/><circle cx="540" cy="70" r="34" fill="${night?'#fff8d6':'#fff3b0'}" opacity=".95"/>
<ellipse cx="120" cy="70" rx="46" ry="16" fill="#fff" opacity=".7"/><ellipse cx="150" cy="60" rx="30" ry="14" fill="#fff" opacity=".7"/>${sky}${bub}
<rect y="330" width="640" height="70" fill="hsl(${h},22%,${night?20:86}%)"/><rect y="330" width="640" height="6" fill="hsl(${h},22%,${night?28:78}%)"/>
<rect x="170" y="170" width="300" height="160" fill="${wall}" stroke="hsl(${h},30%,${night?40:80}%)" stroke-width="2"/>
<rect x="190" y="112" width="260" height="56" rx="12" fill="hsl(${h},70%,30%)"/><circle cx="222" cy="140" r="23" fill="#fff"/><text x="222" y="150" font-size="27" text-anchor="middle">${em}</text>
<text x="346" y="147" font-size="${fs.toFixed(1)}" font-weight="700" fill="#fff" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif">${esc(short)}</text>${aw}
<rect x="190" y="224" width="132" height="86" rx="8" fill="${night?'#ffe9a8':'#cfe6ff'}" stroke="hsl(${h},40%,45%)" stroke-width="4"/><path d="M205 308l40-80h14l-40 80zM240 308l40-80h8l-40 80z" fill="#fff" opacity=".45"/>
<rect x="190" y="282" width="132" height="6" fill="hsl(${h},40%,45%)"/><text x="214" y="278" font-size="26">${em}</text><text x="250" y="278" font-size="26">${em}</text><text x="286" y="278" font-size="26">${em}</text>
<rect x="346" y="228" width="92" height="102" rx="8" fill="hsl(${h},60%,38%)"/><rect x="356" y="238" width="72" height="50" rx="5" fill="${night?'#ffe9a8':'#cfe6ff'}"/><rect x="366" y="296" width="52" height="18" rx="4" fill="#fff"/><text x="392" y="309" font-size="11" font-weight="700" fill="#1f9d45" text-anchor="middle" font-family="Arial,sans-serif">OPEN</text><circle cx="428" cy="300" r="4" fill="#ffd166"/>
<rect x="132" y="304" width="22" height="26" rx="4" fill="#b5651d"/><circle cx="143" cy="294" r="18" fill="#34C759"/><rect x="486" y="304" width="22" height="26" rx="4" fill="#b5651d"/><circle cx="497" cy="294" r="18" fill="#2fb350"/></svg>`;
 const src='data:image/svg+xml;charset=utf8,'+encodeURIComponent(svg).replace(/'/g,'%27').replace(/\(/g,'%28').replace(/\)/g,'%29');
 return{src,css:`url('${src}')`}}

 {k:'bn',t:"Hi, I'm NEBO 👋 I'll build your promotion in about a minute. What's your business name?"},

<div class="ac"><button class="btn ghost" onclick="prev(${i})">Preview</button><button class="btn ${k?'off':''}" onclick="editPromo(${i})">Edit</button></div></div></div></div>`}
function checklist(){const p=S.promos[0],it=[['Account created',1],['First promotion published',!!p],['Phone number added',!!val('phn')],['Address added or home-based',!!val('ad')||!!val('home')],['Business verified',S.vstat=='done']],n=it.filter(x=>x[1]).length;
 return`<b>${Math.round(n/it.length*100)}% complete</b><div class="prog"><i style="width:${n/it.length*100}%"></i></div>${it.map(x=>`<div class="ck ${x[1]?'d':''}">${x[1]?'✅':'⭕'} ${x[0]}</div>`).join('')}<button class="btn ghost" style="margin-top:10px" onclick="nav('verify')">Verify my business</button>`}
const emptyState=(i,h,s)=>`<div class="pc emp"><div class="ei">${i}</div><h3>${h}</h3><p class="hint">${s}</p><button class="btn" onclick="startWz()">Create promotion</button></div>`;
function dashNew(){
 return`<div class="wel"><div><h1>Hi ${esc(val('fn')||'there')}, welcome 👋</h1><p>Your account is ready. Let's get your first promotion live.</p></div><div class="wb">🫧</div></div>
<div class="gr">${stat('👀','Resident views','0','After you publish')}${stat('👆','Promo taps','0','After you publish')}${stat('📞','Calls','0','After you publish')}${stat('⏳','Days left','–','Free plan, 90 days')}</div>
<div class="g2"><div class="pc"><h3>Views this week</h3><div class="emp2">📊<br>No data yet. Your views will appear here once your promotion is live.</div></div><div class="pc"><h3>Getting started</h3>${checklist()}</div></div>`}
const PG={
dash(){const p=S.promos[0];if(!p)return dashNew();return`<div class="wel"><div><h1>Hi ${val('fn')||'there'}, welcome 👋</h1><p>${p?'Your promotion is live and reaching nearby residents.':'Create your first promotion to start reaching residents.'}</p></div><div class="wb">🫧</div></div>
<div class="gr">${stat('👀','Resident views','1,248','▲ 12% this week')}${stat('👆','Promo taps','86','▲ 8%')}${stat('📞','Calls','19','▲ 3')}${stat('⏳','Days left',p?dl(p):'–','Free plan, 90 days')}</div>
<div class="g2"><div class="pc"><h3>Views this week</h3>${chart()}</div><div class="pc"><h3>Get verified</h3>${checklist()}</div></div>
<div class="pc"><div class="hd"><h3>Your promotion</h3><a class="lnk" onclick="nav('promos')">View all</a></div>${p?promoRow(p,0):'<p class="hint">No promotion yet.</p>'}</div>`},
create(){return`<div class="wzw">${wzBar()}<div class="card">${wzView()}</div></div>`},
promos(){if(!S.promos.length)return emptyState('📣','No promotions yet','Create your first one. It only takes a few minutes.');return`<div><h3 style="margin:0 0 12px;font-size:18px">Your promotions</h3><div class="plist">${S.promos.map(promoRow).join('')||'<p class="hint">Nothing here yet.</p>'}</div></div><div class="note">🎈 Free plan: 1 promotion, editable once a week, expires after 90 days.</div>`},
stats(){if(!S.promos.length)return emptyState('📊','No analytics yet','Views, taps and calls show up here once your first promotion is live.');return`<div class="gr">${stat('👀','Views','1,248','▲ 12%')}${stat('👆','Taps','86','▲ 8%')}${stat('📞','Calls','19','▲ 3')}${stat('🚶','Directions opened','31','▲ 5')}</div><div class="pc"><h3>Daily views</h3>${chart(190)}</div><div class="note">💡 Most views happen in the evening. Try ending your offer on a weekend.</div>`},
verify(){const st=S.vstat;return`<div class="pc"><div class="hd"><h3>Business verification</h3><span class="chip2 ${st=='done'?'':'w'}">${st=='done'?'Verified':st=='pending'?'In review':'Not verified'}</span></div><p class="sub">Verified businesses build trust with residents.</p>
<div class="plan ${S.verify=='google'?'sel':''}" onclick="S.verify='google';persist();render()"><div><b>Google Business Profile</b><span>Fastest. Links your listing and address.</span></div></div>
<div class="plan ${S.verify=='alt'?'sel':''}" onclick="S.verify='alt';persist();render()"><div><b>No public address? Verify another way</b><span>Upload a license, or link a social page or invoice.</span></div></div>
<button class="btn" onclick="S.vstat=S.vstat=='pending'?'done':'pending';persist();render();toast(S.vstat=='pending'?'Submitted, review takes 1–2 days':'Verified ✓ (demo)')">${st=='pending'?'Simulate approval':'Start verification'}</button></div>`},
bill(){return`<div class="pl4">${[['Free','$0','1 promotion, editable weekly, 90 days',1],['Weekly','$10/week','1 promotion',0],['Monthly','$30/month','1 promotion',0],['Multi-promotion','$50/month','2 promotions',0]].map(p=>`<div class="pc ${p[3]?'on':''}"><h3>${p[0]}</h3><b style="font-size:22px">${p[1]}</b><p class="hint">${p[2]}</p>${p[3]?'<span class="chip2">Current plan</span>':'<button class="btn ghost" onclick="toast(\'We\\\'ll notify you ✓\')">Notify me</button>'}</div>`).join('')}</div><div class="pc" style="margin-top:12px"><h3>Payment method</h3><p class="hint">🔒 Powered by Stripe. No card needed on the Free plan.</p></div>`},
prof(){return`<div class="pc"><h3>Business profile</h3><label>Business name</label><input id="pf_bn" value="${val('bn')}"><label>Address</label><input id="pf_ad" value="${val('ad')}" placeholder="Not added"><label>Phone</label><input value="${fullPh()}" placeholder="Not added" disabled><label>Website</label><input id="pf_web" value="${val('web')}" placeholder="Not added"><div class="bar"><span></span><button class="btn" onclick="saveProf()">Save</button></div></div>`},
help(){return`<div class="pc"><h3>Help &amp; Support</h3>${[['How long does verification take?','Usually 1–2 business days.'],['How often can I edit a Free promotion?','Once per week.'],['When does my promotion expire?','Free promotions expire after 90 days.'],['Can I get more promotions?','Multi-promotion plans are coming soon.']].map(q=>`<details><summary>${q[0]}</summary><p class="hint">${q[1]}</p></details>`).join('')}<button class="btn" style="margin-top:12px" onclick="toast('Support will reply by email ✉️')">Contact support</button></div>`}};
render();
</script></body></html>
